services:
  - type: web
    name: ftsapp
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ftsapp.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DEBUG
        value: "False"
